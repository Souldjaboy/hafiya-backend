name: HAFIYA final security hotfix

on:
  push:
    branches: [main]
    paths:
      - scripts/hafiya-final-security-hotfix.js
      - .github/workflows/hafiya-final-security-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final HAFIYA security hotfix
        run: node scripts/hafiya-final-security-hotfix.js
      - name: Check backend syntax
        run: node --check server.js && node --check hafiya-extra-routes.js
      - name: Check diff
        run: git diff --check
      - name: Commit hotfix
        run: |
          if git diff --quiet -- server.js hafiya-extra-routes.js sql/046_hafiya_direction_business_permissions.sql; then exit 0; fi
          git config user.name "HAFIYA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js hafiya-extra-routes.js sql/046_hafiya_direction_business_permissions.sql
          git commit -m "Finalize HAFIYA secure results and tenant permissions"
          git push origin HEAD:main
