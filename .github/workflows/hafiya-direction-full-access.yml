name: HAFIYA Direction full access
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hafiya-direction-full-access.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/hafiya-direction-full-access.js
      - run: node --check server.js
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "fix: grant HAFIYA direction full business access" || exit 0
          git push
