name: HAFIYA final tenant scope patch

on:
  push:
    branches: [fix/hafiya-lab-priority]
    paths:
      - scripts/apply-hafiya-final-scope.js
      - .github/workflows/hafiya-final-scope.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hafiya-lab-priority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tenant-scoped permission patch
        run: node scripts/apply-hafiya-final-scope.js
      - name: Syntax check backend
        run: node --check server.js
      - name: Diff check
        run: git diff --check
      - name: Commit generated patch
        run: |
          if git diff --quiet -- server.js; then exit 0; fi
          git config user.name "HAFIYA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Scope HAFIYA Direction permissions to HAFIYA tenant"
          git push origin HEAD:fix/hafiya-lab-priority
