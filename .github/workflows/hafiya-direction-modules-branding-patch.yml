name: HAFIYA direction modules and branding patch

on:
  push:
    branches:
      - fix/hafiya-lab-priority
    paths:
      - scripts/apply-hafiya-direction-modules-branding-patch.js
      - .github/workflows/hafiya-direction-modules-branding-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hafiya-lab-priority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-hafiya-direction-modules-branding-patch.js
      - run: node --check server.js
      - run: git diff --check
      - name: Commit generated patch
        run: |
          if git diff --quiet -- server.js; then
            echo "No generated server.js changes."
            exit 0
          fi
          git config user.name "HAFIYA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Allow HAFIYA direction module management"
          git push origin HEAD:fix/hafiya-lab-priority
